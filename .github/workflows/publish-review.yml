name: Publish provisional forest review data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-review.yml'
permissions:
  contents: read
concurrency:
  group: provisional-forest-review-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry library
        run: python -m pip install shapely==2.1.2
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Refresh release metadata and retained artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TAG: review-v0.1-20261005
        run: |
          if gh release view "$REVIEW_TAG" >/dev/null 2>&1; then
            gh release edit "$REVIEW_TAG" --notes-file docs/REVIEW_RELEASE_NOTES.md
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$REVIEW_TAG" -f sha="$GITHUB_SHA" -F force=true
            for asset in forest_planning_zones_2026_review.zip municipality_forest_zones_2026_candidate.zip review_manifest.json SHA256SUMS.txt; do
              gh release delete-asset "$REVIEW_TAG" "$asset" --yes
            done
          fi
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "provisional-forest-review-20261005") | .id' > /tmp/retained-artifact-ids
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done < /tmp/retained-artifact-ids
      - name: Build and validate review packages
        run: python scripts/build_review_release.py
      - name: Retain checked download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provisional-forest-review-20261005
          path: |
            release_output/*.zip
            release_output/review_manifest.json
            release_output/SHA256SUMS.txt
          retention-days: 30
      - name: Publish review-only prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TAG: review-v0.1-20261005
        run: |
          if gh release view "$REVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$REVIEW_TAG" release_output/*.zip release_output/review_manifest.json release_output/SHA256SUMS.txt --clobber
            gh release edit "$REVIEW_TAG" --notes-file docs/REVIEW_RELEASE_NOTES.md
          else
            gh release create "$REVIEW_TAG" \
              release_output/*.zip release_output/review_manifest.json release_output/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease \
              --title "森林計画区・広域流域 確認用 v0.1（2026-10-05）" \
              --notes-file docs/REVIEW_RELEASE_NOTES.md
          fi
