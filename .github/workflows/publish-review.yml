name: Publish provisional forest review data
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New review tag, for example review-v0.4-20261017 (existing tags are refused)'
        required: true
        type: string
      gap_width_m:
        description: 'Optional: apply the adopted narrow-gap repair with this width in metres (for example 0.001). Leave empty for the v0.3-compatible build.'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: provisional-forest-review-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a new tag on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$REVIEW_TAG" =~ ^review-v[0-9]+\.[0-9]+-[0-9]{8}$ ]]
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$REVIEW_TAG" > "$RUNNER_TEMP/existing-tags.json"
          python -c 'import json,os,sys; refs=json.load(open(sys.argv[1])); assert not any(r["ref"] == "refs/tags/" + os.environ["REVIEW_TAG"] for r in refs), "Tag already exists"' "$RUNNER_TEMP/existing-tags.json"
      - name: Install libraries
        run: python -m pip install shapely==2.1.2 numpy
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Build review packages
        # Narrow-gap repair (adopted 2026-10-28) is applied only when gap_width_m is explicitly given.
        env:
          GAP_WIDTH_M: ${{ inputs.gap_width_m }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GAP_WIDTH_M" ]]; then
            python scripts/build_review_release.py --gap-width-m "$GAP_WIDTH_M"
          else
            python scripts/build_review_release.py
          fi
      - name: Retain checked download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provisional-forest-review-${{ github.run_id }}
          path: |
            release_output/*.zip
            release_output/review_manifest.json
            release_output/SHA256SUMS.txt
          retention-days: 30
      - name: Create a new review-only prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEW_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.gap_width_m }}" ]]; then
            printf '%s\n' '確認用データです。公式境界・所属は未確定です。' '全国の細い隙間の補修（幅 ${{ inputs.gap_width_m }} m、2026-10-28 採用）を適用した生成処理です。検証記録はリポジトリの docs にあります。' > "$RUNNER_TEMP/release-notes.txt"
          else
            printf '%s\n' '確認用データです。公式境界・所属は未確定です。' 'v0.3互換の生成処理です。全国の精度処理・隙間補修は未採用です。' > "$RUNNER_TEMP/release-notes.txt"
          fi
          gh release create "$REVIEW_TAG" \
            release_output/*.zip release_output/review_manifest.json release_output/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --fail-on-no-commits \
            --title "森林計画区・広域流域 確認用 $REVIEW_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
