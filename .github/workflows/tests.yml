name: tests

# main への push と、すべての PR でテストを走らせる。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ユーザーの実行環境（Windows・QGIS 付属の Python 3.12）と、README に書いた最低版（3.9）を確かめる。
        # 3.9 のジョブだけ ubuntu-24.04 に固定する: ubuntu-latest が Ubuntu 26.04 になり、
        # actions/setup-python が 3.9 を提供しなくなったため（2026-10、PR #8 の CI で確認）。
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # pyproj は EPSG の定義との照合テスト、numpy は小さい穴を取り除くスクリプトのテストだけに使う（なくてもほかのテストは動く）。
      - name: Install pyproj and numpy
        run: python -m pip install pyproj numpy
      - name: Install geometry library for Python 3.12
        if: matrix.python-version == '3.12'
        run: python -m pip install shapely==2.1.2 scipy
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Audit forest tables and display styles
        run: python scripts/audit_forest_tables_styles.py
      - name: Run tests
        # 元データ（N03）はリポジトリに入れていないので、N03_DBF を使うテストはスキップされる。
        run: python -m unittest discover -s tests -v
